name: Platform Matrix

on:
  push:
  pull_request:

jobs:
  docker-platform:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - rocky-9
          - ubi-9
    steps:
      - uses: actions/checkout@v4
      - run: tools/test-docker-platforms.sh "${{ matrix.platform }}"
